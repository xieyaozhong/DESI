name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: Syntax and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check desi-ten-worlds.js
          node --check desi-crystal-assembly.js
          node --check desi-visual-qa-final.js
          node --check desi-director-v4.js
          node --check desi-director-v6.js

      - name: Run portfolio smoke tests
        run: node --test tests/smoke.test.mjs
